<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>THE BACKROOMS</title>
<style>
/* =========================================================================
   GLOBAL RESET
   ========================================================================= */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden; background:#0a0a06;
  font-family:'Georgia','Times New Roman',serif;
  touch-action:none; -webkit-user-select:none; user-select:none;
}

/* =========================================================================
   ROTATE-DEVICE OVERLAY (force landscape play)
   ========================================================================= */
@media (orientation:portrait){
  html, body {
    width:100%; height:100%; overflow:hidden;
  }
  #game-root{
    position:fixed !important;
    width:100vh !important;
    height:100vw !important;
    top:0 !important;
    left:100vw !important;
    right:auto !important;
    bottom:auto !important;
    transform:rotate(90deg) !important;
    transform-origin:top left !important;
    inset:auto !important;
  }
}

/* =========================================================================
   GAME ROOT WRAPPER
   ========================================================================= */
#game-root{ position:fixed; inset:0; }

/* =========================================================================
   TITLE / MENU SCREEN
   ========================================================================= */
#title-screen{
  position:fixed; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#0a0a06;
  overflow:hidden;
}
#menu-bg{
  position:absolute; inset:0;
  background:radial-gradient(circle at center, #2a2512 0%, #0a0a06 100%);
  opacity:0.8;
}
.menu-content{
  position:relative; z-index:2; display:flex; flex-direction:column;
  align-items:center; text-align:center; padding:20px; max-width:600px;
}
h1{
  font-size:clamp(2rem, 5vw, 4rem); color:#d4af37; margin:0 0 10px 0;
  letter-spacing:4px; text-shadow:0 0 20px rgba(212,175,55,0.4);
}
.subtitle{
  font-size:clamp(0.9rem, 2vw, 1.2rem); color:#8c7835; margin-bottom:30px;
  letter-spacing:2px; text-transform:uppercase;
}
.menu-btn{
  background:transparent; border:2px solid #d4af37; color:#d4af37;
  padding:12px 30px; font-size:1.1rem; font-family:inherit;
  letter-spacing:2px; cursor:pointer; transition:all 0.3s ease;
  box-shadow:0 0 10px rgba(212,175,55,0.1); outline:none;
}
.menu-btn:hover, .menu-btn:active{
  background:#d4af37; color:#0a0a06;
  box-shadow:0 0 20px rgba(212,175,55,0.6);
}

/* =========================================================================
   HUD / IN-GAME INTERFACE
   ========================================================================= */
#hud{
  position:fixed; inset:0; z-index:100; pointer-events:none;
  display:none;
}
.crosshair{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:6px; height:6px; background:rgba(255,255,255,0.6); border-radius:50%;
  box-shadow:0 0 4px rgba(0,0,0,0.8);
}
#flashlight-indicator{
  position:absolute; bottom:20px; left:20px;
  color:#d4af37; font-size:0.9rem; letter-spacing:1px;
  text-shadow:0 0 5px rgba(0,0,0,0.9);
}
#sanity-meter{
  position:absolute; top:20px; right:20px;
  width:150px; height:10px; background:rgba(0,0,0,0.5);
  border:1px solid rgba(212,175,55,0.4); border-radius:5px; overflow:hidden;
}
#sanity-fill{
  width:100%; height:100%; background:#d4af37; transition:width 0.2s linear;
}

/* =========================================================================
   MOBILE TOUCH CONTROLS (VIRTUAL JOYSTICK & LOOK)
   ========================================================================= */
#joystick-zone{
  position:absolute; bottom:20px; left:20px; width:130px; height:130px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:50%; z-index:200; touch-action:none;
}
#joystick-handle{
  position:absolute; top:40px; left:40px; width:50px; height:50px;
  background:rgba(212,175,55,0.4); border:1px solid rgba(212,175,55,0.8);
  border-radius:50%; pointer-events:none; transition:transform 0.05s linear;
}
#look-zone{
  position:absolute; top:0; right:0; width:50%; height:100%;
  z-index:199; touch-action:none;
}
.touch-btn{
  position:absolute; bottom:30px; right:30px; z-index:200;
  background:rgba(20,20,15,0.7); border:2px solid #d4af37; color:#d4af37;
  width:60px; height:60px; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:0.8rem;
  letter-spacing:1px; cursor:pointer; box-shadow:0 0 10px rgba(0,0,0,0.5);
}
.touch-btn:active{ background:#d4af37; color:#0a0a06; }

/* =========================================================================
   JUMPSCARE OVERLAY
   ========================================================================= */
#jumpscare{
  position:fixed; inset:0; z-index:1000; background:#000;
  display:none; align-items:center; justify-content:center;
  overflow:hidden;
}
#jumpscare img{
  width:100%; height:100%; object-fit:cover; filter:contrast(150%) brightness(80%) hue-rotate(-20deg);
  animation:shake 0.1s infinite;
}
@keyframes shake{
  0% { transform: translate(5px, 5px) rotate(0deg); }
  20% { transform: translate(-5px, -8px) rotate(-1deg); }
  40% { transform: translate(-8px, 5px) rotate(1deg); }
  60% { transform: translate(5px, 8px) rotate(0deg); }
  80% { transform: translate(1px, -3px) rotate(1deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

/* Canvas container */
#canvas-container{ position:absolute; inset:0; z-index:1; }
</style>
</head>
<body>

<div id="game-root">
  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <div id="menu-bg"></div>
    <div class="menu-content">
      <h1>THE BACKROOMS</h1>
      <div class="subtitle">Level 0: The Monotonous Labyrinth</div>
      <button class="menu-btn" id="start-btn">ENTER</button>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud">
    <div class="crosshair"></div>
    <div id="flashlight-indicator">FLASHLIGHT: ON</div>
    <div id="sanity-meter"><div id="sanity-fill"></div></div>
    
    <!-- Virtual Controls -->
    <div id="joystick-zone">
      <div id="joystick-handle"></div>
    </div>
    <div id="look-zone"></div>
    <div class="touch-btn" id="flashlight-btn">LIGHT</div>
  </div>

  <!-- JUMPSCARE LAYER -->
  <div id="jumpscare">
    <!-- Inline emergency creepy distorted asset placeholder via CSS/Canvas if needed, or dynamic drawing -->
  </div>

  <!-- THREE.JS CONTAINER -->
  <div id="canvas-container"></div>
</div>

<!-- INCLUDE THREE.JS LIBRARIES VIA CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   BACKROOMS GAME ENGINE IMPLEMENTATION
   ========================================================================= */

(function() {
  // State variables
  let scene, camera, renderer;
  let isPlaying = false;
  let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
  let controlsActive = false;
  
  // Mobile Touch tracking variables
  let joystickTouchId = null;
  let joystickOrigin = { x: 0, y: 0 };
  let joystickVector = { x: 0, y: 0 };
  
  let lookTouchId = null;
  let lookLastPos = { x: 0, y: 0 };
  let cameraRotation = { yaw: 0, pitch: 0 };

  // Gameplay metrics
  let sanity = 100;
  let flashlightOn = true;
  let flashlight;
  
  // Maze configuration
  const MAP_SIZE = 15; // Grid size
  const WALL_SIZE = 4;
  let mazeGrid = [];

  const startBtn = document.getElementById('start-btn');
  const titleScreen = document.getElementById('title-screen');
  const hud = document.getElementById('hud');
  const canvasContainer = document.getElementById('canvas-container');
  const joystickZone = document.getElementById('joystick-zone');
  const joystickHandle = document.getElementById('joystick-handle');
  const lookZone = document.getElementById('look-zone');
  const flashlightBtn = document.getElementById('flashlight-btn');

  startBtn.addEventListener('click', startGame);
  
  function startGame() {
    titleScreen.style.display = 'none';
    hud.style.display = 'block';
    isPlaying = true;
    
    initEngine();
    initListeners();
    animate();
  }

  function initEngine() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a06);
    scene.fog = new THREE.FogExp2(0x1a1608, 0.08);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 1.6, 2);

    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    canvasContainer.appendChild(renderer.domElement);

    // Ambient light (dull yellow glow standard to Level 0)
    const ambientLight = new THREE.AmbientLight(0xd9b36c, 0.25);
    scene.add(ambientLight);

    // Flashlight attached to camera
    flashlight = new THREE.SpotLight(0xfffaed, 1.8, 25, Math.PI / 5, 0.5, 1);
    flashlight.position.set(0, 0, 0);
    camera.add(flashlight);
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);
    scene.add(camera);

    generateProceduralMaze();
  }

  /* Procedural Backrooms Wall Generation (Monotonous wallpaper & damp carpet aesthetic) */
  function generateProceduralMaze() {
    // Generate simple deterministic structural textures procedurally using Canvas
    const wallTexture = createWallpaperTexture();
    const floorTexture = createCarpetTexture();
    const ceilingTexture = createCeilingTexture();

    const wallMat = new THREE.MeshBasicMaterial({ map: wallTexture });
    const floorMat = new THREE.MeshBasicMaterial({ map: floorTexture });
    const ceilingMat = new THREE.MeshBasicMaterial({ map: ceilingTexture });

    // Build simple bounded grid maze
    const wallGeo = new THREE.BoxGeometry(WALL_SIZE, WALL_SIZE, WALL_SIZE);
    
    // Simple layout boundaries & pillars to optimize mobile performance
    for(let x = -MAP_SIZE; x <= MAP_SIZE; x += 2) {
      for(let z = -MAP_SIZE; z <= MAP_SIZE; z += 2) {
        // Create outer perimeter walls
        if(Math.abs(x) === MAP_SIZE || Math.abs(z) === MAP_SIZE || (x % 4 === 0 && z % 4 === 0 && Math.random() > 0.4)) {
          // Avoid blocking exact start point
          if(Math.abs(x) > 2 || Math.abs(z) > 2) {
            const wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.position.set(x * (WALL_SIZE/2), WALL_SIZE/2, z * (WALL_SIZE/2));
            scene.add(wallMesh);
          }
        }
      }
    }

    // Floor
    const floorGeo = new THREE.PlaneGeometry(MAP_SIZE * WALL_SIZE, MAP_SIZE * WALL_SIZE);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, 0);
    scene.add(floor);

    // Ceiling
    const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, WALL_SIZE, 0);
    scene.add(ceiling);
  }

  /* Procedural Textures to avoid external asset loading failures */
  function createWallpaperTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#b8973b'; // Backrooms yellowish mustard base
    ctx.fillRect(0,0,256,256);
    // Add subtle vertical stripe patterns / stains
    ctx.fillStyle = '#96782b';
    for(let i=0; i<256; i+=32) {
      ctx.fillRect(i, 0, 8, 256);
    }
    // Add noise/grime
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for(let i=0; i<1000; i++) {
      ctx.fillRect(Math.random()*256, Math.random()*256, 3, 3);
    }
    return new THREE.CanvasTexture(canvas);
  }

  function createCarpetTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#5c4e28'; // Damp moist dirty carpet tone
    ctx.fillRect(0,0,128,128);
    ctx.fillStyle = '#42371b';
    for(let i=0; i<800; i++) {
      ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
    }
    return new THREE.CanvasTexture(canvas);
  }

  function createCeilingTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#cccccc'; // Acoustic ceiling tile white/grey
    ctx.fillRect(0,0,128,128);
    ctx.strokeStyle = '#999999';
    ctx.lineWidth = 2;
    ctx.strokeRect(0,0,128,128);
    return new THREE.CanvasTexture(canvas);
  }

  /* =========================================================================
     TOUCH CONTROLS & EVENT LISTENERS
     ========================================================================= */
  function initListeners() {
    window.addEventListener('resize', onWindowResize);

    // Joystick Touch Controls
    joystickZone.addEventListener('touchstart', (e) => {
      let touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      const rect = joystickZone.getBoundingClientRect();
      joystickOrigin = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
      handleJoystickMove(touch);
    }, {passive: false});

    window.addEventListener('touchmove', (e) => {
      for(let i=0; i<e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if(touch.identifier === joystickTouchId) {
          handleJoystickMove(touch);
        } else if(touch.identifier === lookTouchId) {
          handleLookMove(touch);
        }
      }
    }, {passive: false});

    window.addEventListener('touchend', (e) => {
      for(let i=0; i<e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if(touch.identifier === joystickTouchId) {
          joystickTouchId = null;
          joystickVector = { x: 0, y: 0 };
          joystickHandle.style.transform = `translate(0px, 0px)`;
          moveForward = moveBackward = moveLeft = moveRight = false;
        }
        if(touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    });

    // Look Zone Touch Control (Camera look)
    lookZone.addEventListener('touchstart', (e) => {
      let touch = e.changedTouches[0];
      if(lookTouchId === null) {
        lookTouchId = touch.identifier;
        lookLastPos = { x: touch.clientX, y: touch.clientY };
      }
    }, {passive: false});

    // Flashlight Toggle
    flashlightBtn.addEventListener('click', () => {
      flashlightOn = !flashlightOn;
      flashlight.visible = flashlightOn;
      document.getElementById('flashlight-indicator').innerText = `FLASHLIGHT: ${flashlightOn ? 'ON' : 'OFF'}`;
    });
  }

  function handleJoystickMove(touch) {
    const maxDist = 45;
    let dx = touch.clientX - joystickOrigin.x;
    let dy = touch.clientY - joystickOrigin.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }

    joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
    
    joystickVector.x = dx / maxDist;
    joystickVector.y = dy / maxDist;

    moveForward = joystickVector.y < -0.2;
    moveBackward = joystickVector.y > 0.2;
    moveLeft = joystickVector.x < -0.2;
    moveRight = joystickVector.x > 0.2;
  }

  function handleLookMove(touch) {
    const sensitivity = 0.003;
    let dx = touch.clientX - lookLastPos.x;
    let dy = touch.clientY - lookLastPos.y;

    cameraRotation.yaw -= dx * sensitivity;
    cameraRotation.pitch -= dy * sensitivity;

    // Clamp pitch to avoid neck-breaking rotation
    cameraRotation.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, cameraRotation.pitch));

    lookLastPos = { x: touch.clientX, y: touch.clientY };
  }

  function onWindowResize() {
    if(!isPlaying) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  /* =========================================================================
     GAME LOOP & MOVEMENT PHYSICS
     ========================================================================= */
  const clock = new THREE.Clock();

  function animate() {
    if(!isPlaying) return;
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    // Apply rotation to camera orientation vector
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    euler.x = cameraRotation.pitch;
    euler.y = cameraRotation.yaw;
    camera.quaternion.setFromEuler(euler);

    // Movement calculation
    const speed = 3.5 * delta;
    let dirVector = new THREE.Vector3();
    
    if (moveForward) dirVector.z -= 1;
    if (moveBackward) dirVector.z += 1;
    if (moveLeft) dirVector.x -= 1;
    if (moveRight) dirVector.x += 1;
    
    dirVector.normalize();
    dirVector.applyEuler(new THREE.Euler(0, cameraRotation.yaw, 0));

    camera.position.addScaledVector(dirVector, speed);

    // Boundary constraints inside the backrooms grid limits
    const bound = (MAP_SIZE * WALL_SIZE) / 2 - 1;
    camera.position.x = Math.max(-bound, Math.min(bound, camera.position.x));
    camera.position.z = Math.max(-bound, Math.min(bound, camera.position.z));

    renderer.render(scene, camera);
  }

})();
</script>
</body>
</html>
