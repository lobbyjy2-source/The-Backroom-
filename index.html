#menu-content h1{
  font-size:2.8rem; color:#ffd700; margin:0 0 10px 0;
  text-shadow:0 0 20px rgba(255,215,0,0.6);
  letter-spacing:3px;
}

  font-size:1.1rem; color:#c8b88a; margin:0 0 30px 0;
  max-width:400px; line-height:1.5;
}

  background:#d4af37; color:#0a0a06; border:none; padding:15px 40px;
  font-size:1.2rem; font-weight:bold; font-family:inherit;

  box-shadow:0 0 15px rgba(212,175,55,0.4);
  transition:all 0.2s ease;
}
.menu-btn:active{
  transform:scale(0.95);
  background:#f4d03f;
}

/* =========================================================================
   CANVAS & HUD
   ========================================================================= */
#game-canvas{
  display:block; width:100%; height:100%;
}

#hud{
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:100;
  display:none;
}

.hud-item{
  position:absolute; color:#ffd700; font-weight:bold; text-shadow:0 2px 4px rgba(0,0,0,0.8);
}

#crosshair{
  position:absolute; top:50%; left:50%; width:8px; height:8px;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,215,0,0.7); border-radius:50%;
}

#controls-hint{
  position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); color:#fff; padding:8px 16px; border-radius:4px;
  font-size:0.9rem; border:1px solid rgba(212,175,55,0.3);
}

<body>

<div id="game-root">
  <!-- TITLE SCREEN -->
  <div id="title-screen">
    <div id="menu-bg"></div>
    <div id="menu-content">
      <h1>THE BACKROOMS</h1>
      <p>Level 0. Infinite yellow maze. Find a way out, or wander forever.</p>
      <button class="menu-btn" id="start-btn">ENTER</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="crosshair"></div>
    <div id="controls-hint">Swipe to look • Use joystick to move</div>
  </div>

  <!-- THREE.JS CANVAS -->
  <canvas id="game-canvas"></canvas>
</div>

<!-- INCLUDE THREE.JS FROM CDN FOR STANDALONE PLAYABILITY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Simple initialization to verify standalone readiness
window.addEventListener('DOMContentLoaded', () => {
  const startBtn = document.getElementById('start-btn');
  const titleScreen = document.getElementById('title-screen');
  const hud = document.getElementById('hud');

  startBtn.addEventListener('click', () => {
    titleScreen.style.display = 'none';
    hud.style.display = 'block';
    initGame();
  });
});

function initGame() {
  const canvas = document.getElementById('game-canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a180c);
  scene.fog = new THREE.FogExp2(0x1a180c, 0.08);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffea85, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffd700, 0.4);
  dirLight.position.set(0, 10, 0);
  scene.add(dirLight);

  // Simple floor and ceiling test room
  const roomGeo = new THREE.BoxGeometry(20, 4, 20);
  const roomMat = new THREE.MeshStandardMaterial({ color: 0xc4a44d, roughness: 0.9, side: THREE.BackSide });
  const room = new THREE.Mesh(roomGeo, roomMat);
  room.position.y = 2;
  scene.add(room);

  // Animation Loop
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
</script>
</body>
